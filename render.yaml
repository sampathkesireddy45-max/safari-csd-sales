services:
  - type: web
    name: safari-csd-sales
    runtime: python
    plan: free
    buildCommand: "chmod +x render-build.sh && ./render-build.sh"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: NODE_VERSION
        value: 20.11.0
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
